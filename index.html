<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>济事楼楼层导航</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class="hero-inner">
            <div>
                <p class="eyebrow">Tongji University Jiading Campus</p>
                <h1>济事楼楼层导航</h1>
                <p class="subtitle">快速查看房间位置、用途、教师信息与现场照片</p>
            </div>
            <a class="refresh-link" href="" aria-label="刷新页面">
                <img src="images/refresh.jpg" alt="">
            </a>
        </div>
    </header>

    <main class="app-shell">
        <section class="controls-panel" aria-label="楼层和房间查询">
            <div class="floor-tabs" role="tablist" aria-label="选择楼层">
                <button class="floor-tab active" type="button" data-floor="4">4楼</button>
                <button class="floor-tab" type="button" data-floor="5">5楼</button>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="搜索房间名称、教师名称或房间号">
                <button type="button" onclick="searchInfo()">搜索</button>
            </div>

            <div class="quick-select-container">
                <select id="roomSelect">
                    <option value="">快速选择房间...</option>
                </select>
                <button type="button" onclick="selectRoom()">查看房间</button>
            </div>
        </section>

        <section class="floor-section" aria-label="楼层平面图">
            <div class="floor-toolbar">
                <div>
                    <p class="floor-label">当前楼层</p>
                    <h2 id="currentFloorTitle">4楼平面图</h2>
                </div>
                <p class="floor-hint">点击高亮区域查看房间详情</p>
            </div>

            <div class="floor-plan">
                <img id="floorplanImage" src="images/floorplan.png" alt="4楼平面图" width="1600" class="floorplan-img">
                <div id="rooms-container"></div>
                <div class="map-message" id="mapMessage" hidden></div>
            </div>
        </section>
    </main>
    
    <div class="search-result" id="searchResult"></div>
    <script src="script.js"></script>
</body>
</html>
